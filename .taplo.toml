# One TOML formatter for the repository (checklist 5): `just fmt` runs `taplo fmt`, `just lint` runs `taplo fmt --check`.
# taplo does not honour .gitignore, so generated and dependency trees are excluded here. mise.lock is not a *.toml
# file and is generated by mise, so taplo never sees it.
include = ["**/*.toml"]
exclude = [
  "node_modules/**",
  ".cache/**",
  "crates/target/**",
  ".agents/**",
  ".claude/**",
  ".jj/**",
  ".git/**",
]
