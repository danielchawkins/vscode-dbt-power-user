# The solver, Fenwick, crossing, order and placement fixtures are hexadecimal IEEE bit patterns, one per coordinate; `typos`
# reads runs such as `ba` or `daa` as misspelt words. Only those fixtures are excluded, each by its exact path: every other
# file is checked as before.
[files]
extend-exclude = [
  "graph-layout/fixtures/parity/solve-*.txt",
  "graph-layout/fixtures/parity/fenwick.txt",
  "graph-layout/fixtures/parity/crossings.txt",
  "graph-layout/fixtures/parity/order.txt",
  "graph-layout/fixtures/parity/place.txt",
]
