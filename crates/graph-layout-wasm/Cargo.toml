[package]
name = "graph-layout-wasm"
description = "WebAssembly binding for graph-layout (wasm-bindgen), for browser, Worker and Node."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
graph-layout = { path = "../graph-layout" }
# Equal to the wasm-bindgen-cli version in mise.toml; bump both together.
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
