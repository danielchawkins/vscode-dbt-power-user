[package]
name = "graph-layout-wasm"
description = "WebAssembly binding for graph-layout (wasm-bindgen), for browser, Worker and Node."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
graph-layout = { path = "../graph-layout", features = ["serde"] }
# Equal to the wasm-bindgen-cli version in mise.toml; bump both together.
wasm-bindgen = "=0.2.129"
# The options are JSON text on the boundary (ADR 0011, Decision 6).
serde_json = "1"

[lints]
workspace = true
