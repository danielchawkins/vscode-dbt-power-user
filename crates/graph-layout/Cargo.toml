[package]
name = "graph-layout"
description = "Deterministic graph layout core: model, index, layering, ordering, placement, routing and engine."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

# The core has no normal dependency by default. `serde` (JSON for options and fixtures) is the one optional dependency
# the ADR allows now; `parallel` (rayon) arrives with Phase 6. `proptest` is a dev-dependency only, so `boundaries/`
# (which diffs the normal tree) does not change. Its `std` feature alone: the fork and timeout features need processes
# and threads, which `wasm32-wasip1` does not have.
[features]
parallel = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
