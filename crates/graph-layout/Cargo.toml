[package]
name = "graph-layout"
description = "Deterministic graph layout core: model, index, layering, ordering, placement, routing and engine."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

# The core has no normal dependency by default. `serde` (JSON for options and fixtures) and `rayon` (the `parallel`
# feature: the thorough restarts run on the global pool) are the optional dependencies the ADR allows. `proptest` is a
# dev-dependency only, so `boundaries/` (which diffs the normal tree) does not change with it. Its `std` feature alone:
# the fork and timeout features need processes and threads, which `wasm32-wasip1` does not have.
[features]
parallel = ["dep:rayon"]
serde = ["dep:serde"]

[dependencies]
rayon = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
