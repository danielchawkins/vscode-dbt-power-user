[package]
name = "graph-layout-napi"
description = "Node-API binding for graph-layout (napi-rs v3), for the extension host's native path."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
graph-layout = { path = "../graph-layout" }
napi = "3"
napi-derive = "3"

[lints]
workspace = true

[package.metadata.cargo-machete]
# The #[napi] expansion names napi:: items, so the dependency is used through the macro, which machete cannot see.
ignored = ["napi"]
