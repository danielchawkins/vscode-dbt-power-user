# Contributor tooling only. None of this ships in the VSIX, and the extension must
# never invoke mise. Fusion is pinned to the minimum version the product claims, so a
# failing integration test is attributable to the extension rather than a Fusion upgrade.
[tools]
# Cursor 3.23 runs Node 24.18.1. Both hosts must move before this cap is raised.
node = "24.18"
just = "latest"
"github:terror/just-lsp" = "latest"
lefthook = "latest"
"aqua:rvben/rumdl" = "latest"
"aqua:mvdan/sh" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:rhysd/actionlint" = "latest"
"aqua:jj-vcs/jj" = "latest"
"aqua:getdbt.com/dbt-fusion" = "2.0.6"
"aqua:ast-grep/ast-grep" = "latest"

# Rust tooling. The toolchain is rust-toolchain.toml, which mise reads through idiomatic_version_file_enable_tools.
# Each CLI comes from an aqua or GitHub release with checksums; cargo: backends would compile it in CI.
"aqua:tamasfe/taplo" = "latest"
"aqua:EmbarkStudios/cargo-deny" = "latest"
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"github:taiki-e/cargo-hack" = "latest"
"github:bnjbvr/cargo-machete" = "latest"
"aqua:crate-ci/typos" = "latest"
# Equal to the wasm-bindgen crate version in crates/Cargo.toml; bump both together.
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"
"aqua:WebAssembly/binaryen" = "latest"

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]
