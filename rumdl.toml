# CLAUDE.md is a symlink to AGENTS.md and would otherwise be checked twice.
flavor = "github"
respect-gitignore = true
# Prose uses one physical line per paragraph and editor soft wrapping.
line-length = 119
disable = ["MD013", "MD029"]
exclude = [
  "media/**",
  ".github/**",
  "CLAUDE.md",
  # Vendored sample dbt projects and formatter fixtures. Their Markdown is test input,
  # not prose this repository owns.
  "scripts/spikes/lsp-capabilities/jaffle-shop-duckdb/**",
  "src/test/fixtures/**",
]

# Asterisk emphasis, and tables aligned to the line width (MD060 compacts a table wider than max-width).
[MD049]
style = "asterisk"

[MD050]
style = "asterisk"

[MD060]
enabled = true
style = "aligned"
max-width = 119
