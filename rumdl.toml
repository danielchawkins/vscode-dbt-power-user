# Upstream Altimate Markdown that is slated for deletion rather than repair stays
# excluded. CLAUDE.md is a symlink to AGENTS.md and would otherwise be checked twice.
flavor = "github"
line-length = 119
respect-gitignore = true
disable = ["MD029"]
exclude = [
  "media/**",
  "altimate_packages/**",
  "webview_panels/**",
  ".github/**",
  "CLAUDE.md",
  # Vendored sample dbt projects and formatter fixtures. Their Markdown is test input,
  # not prose this repository owns.
  "test-fixtures/**",
  "src/test/fixtures/**",
]

[MD013]
code-blocks = false
