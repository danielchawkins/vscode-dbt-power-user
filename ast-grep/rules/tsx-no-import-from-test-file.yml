# A test file is an entry point: importing one registers its suites in the importer, so they run twice, and its
# exports are helpers that only one test can see. Shared fixtures, harnesses and tested-control lists live in a
# non-test module (webview_panels/src/test/ or src/test/), which both test files import.
id: tsx-no-import-from-test-file
language: tsx
severity: error
message: >-
  Do not import from a `.test` file; it registers that file's tests here too. Move the shared value into a
  non-test module under the tree's test/ folder and import it from there.
files:
  - src/**
  - webview_panels/src/**
  - packages/**
rule:
  any:
    - kind: import_statement
      has:
        field: source
        regex: '\.test(\.tsx?)?["'']$'
    - kind: export_statement
      has:
        field: source
        regex: '\.test(\.tsx?)?["'']$'
    - kind: call_expression
      all:
        - has: { field: function, regex: '^(import|require)$' }
        - has: { field: arguments, has: { kind: string, regex: '\.test(\.tsx?)?["'']$' } }
