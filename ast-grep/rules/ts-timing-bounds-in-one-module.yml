# Every wall-clock bound the extension sets lives in src/core/timing.ts (process and OS bounds, each with its reason)
# or src/core/lsp/requestPolicy.ts (server request classes). A timeout tuned at a call site is how the fixed 5 s
# `dbt.listNodes` deadline broke column lineage on a 995-model project. The `ignores` list below is a ratchet: each
# refactor step that moves or deletes a constant removes its file from it; nothing is added.
id: ts-timing-bounds-in-one-module
language: typescript
severity: error
message: >-
  Name timing bounds in src/core/timing.ts or src/core/lsp/requestPolicy.ts, not here. A request to the Fusion
  server takes a request purpose (see REQUEST_POLICIES) instead of a number.
files:
  - src/**
ignores:
  - src/core/timing.ts
  - src/core/lsp/requestPolicy.ts
  - src/test/**
  - "**/*.test.ts"
  # Ratchet: remove each entry when its constant moves or goes.
  - src/core/lsp/commands.ts
  - src/fusion/compileSignal.ts
  - src/fusion/fusionClient.ts
  - src/fusion/lspProcess.ts
  - src/fusion/toolEnvironment.ts
  - src/executable/configuredFusionExecutableResolver.ts
  - src/projects/clients/fusionClientPool.ts
  - src/projects/manifest/manifestTrigger.ts
  - src/features/docs/docsEditPanel.ts
rule:
  any:
    # const COMMAND_DEADLINE_MS = 5_000;
    - all:
        - kind: variable_declarator
        - has:
            field: name
            regex: '(?i)(_MS|TIMEOUT|DEADLINE|DEBOUNCE|GRACE|BACKOFF)'
        - has:
            field: value
            kind: number
    # setTimeout(fn, 5000) / whenReady(page, 10_000)
    - all:
        - kind: number
        - regex: '^[0-9_]{3,}$'
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                regex: '(setTimeout|whenReady|after|sleep)$'
