# Only the Save button writes the documentation. Proposal components and hooks send through `requests.ts`, and a
# `saveDocumentation` sent from anywhere else would write without the user clicking Save.
id: tsx-save-only-from-save-button
language: tsx
severity: error
message: >-
  `saveDocumentation` may be sent only from
  webviews/src/modules/documentationEditor/components/saveDocumentation/SaveDocumentation.tsx, the Save button.
  Put the save in that component. For an exception, put
  `ast-grep-ignore: tsx-save-only-from-save-button -- <why>` in a comment above the line and say why in review.
files:
  - webviews/src/**
ignores:
  - webviews/src/modules/documentationEditor/components/saveDocumentation/SaveDocumentation.tsx
  - webviews/src/test/**
  - webviews/src/**/*.test.ts
  - webviews/src/**/*.test.tsx
rule:
  any:
    - pattern: executeRequestInSync("saveDocumentation", $$$)
    - pattern: executeRequestInAsync("saveDocumentation", $$$)
