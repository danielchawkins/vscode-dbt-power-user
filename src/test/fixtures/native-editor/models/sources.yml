version: 2
sources:
  - name: raw
    schema: main
    tables:
      - name: orders
        columns:
          - { name: id, data_type: integer, description: "Order primary key." }
          - { name: customer_id, data_type: integer, description: "Customer key." }
          - { name: amount, data_type: "decimal(10,2)", description: "Order amount in dollars." }
          - { name: status, data_type: varchar, description: "Order status code." }
          - { name: note, data_type: varchar, description: "Free-text note on the order." }
      - name: customers
        columns:
          - { name: id, data_type: integer }
          - { name: name, data_type: varchar }
          - { name: active, data_type: boolean }
      - name: contacts
        columns:
          - { name: user_id, data_type: integer }
          - { name: contact, data_type: varchar }
