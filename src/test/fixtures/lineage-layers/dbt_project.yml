name: lineage_layers
version: 1.0.0
config-version: 2
profile: lineage_layers
model-paths:
  - models
seed-paths:
  - seeds
# The extension's schema-origin hook: with every source column typed, strict analysis needs no warehouse.
sources:
  +schema_origin: "{{ env_var('FUSION_POWER_USER_SCHEMA_ORIGIN', 'remote') }}"
models:
  lineage_layers:
    13_staging:
      +materialized: view
      +schema: staging
    21_intermediate:
      +materialized: table
      +schema: intermediate
    31_marts:
      +materialized: table
      +schema: marts
