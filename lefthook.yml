pre-commit:
  parallel: true
  commands:
    typescript:
      glob: "src/**/*.{ts,tsx}"
      run: mise exec -- npm run lint
    webview:
      glob: "webview_panels/src/**/*.{ts,tsx}"
      run: mise exec -- npm run lint --prefix ./webview_panels
    prettier:
      glob: "*.{js,css,html,json}"
      run: mise exec -- npm run check:format
    markdown:
      glob: "*.md"
      run: mise exec -- npm run check:markdown

pre-push:
  commands:
    check:
      run: mise exec -- just check
