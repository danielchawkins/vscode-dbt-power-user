pre-commit:
  parallel: true
  commands:
    typescript:
      glob: "{src,packages}/**/*.{ts,tsx}"
      run: mise exec -- just lint-code
    webview:
      glob: "webviews/src/**/*.{ts,tsx}"
      run: mise exec -- just webviews::lint
    format:
      glob: "*.{js,cjs,mjs,ts,tsx,css,html,json}"
      run: mise exec -- just lint-format
    markdown:
      glob: "*.md"
      run: mise exec -- just lint-markdown
    shell:
      glob: "scripts/**/*.sh"
      run: mise exec -- shfmt -d -i 2 -ci -sr {staged_files} && mise exec -- shellcheck {staged_files}
    # Clippy stays out of pre-commit: it compiles the workspace, and `just check` runs it before every push.
    rust-format:
      glob: "crates/**/*.rs"
      run: mise exec -- just crates::fmt-check
    # A bare `*.toml`: lefthook 2.1.17 matches it at the root and in subfolders (crates/*/Cargo.toml included), while
    # `**/*.toml` matches only subfolders and would skip the root manifests. `rustEditorHooks.test.ts` pins this.
    toml:
      glob: "*.toml"
      run: mise exec -- taplo fmt --check {staged_files}

pre-push:
  commands:
    check:
      run: mise exec -- just check
