<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lineage card designs</title>
<link rel="stylesheet" href="codicon.css">
<script src="themes.js"></script>
<script src="dagre.js"></script>
<style>
/* Page chrome: only the theme's own variables, as the webview gets them. */
html, body { margin: 0; }
body {
  background: var(--vscode-editor-background);
  color: var(--vscode-foreground);
  font-family: var(--vscode-font-family, system-ui, sans-serif);
  font-size: var(--vscode-font-size, 13px);
}
.page-head { display: flex; gap: 16px; align-items: baseline; padding: 12px 20px 4px; }
.page-head h1 { margin: 0; font-size: 18px; }
.page-head span { color: var(--vscode-descriptionForeground); }
.panel { margin: 12px 20px 24px; }
.panel h2 { margin: 0 0 2px; font-size: 14px; }
.panel p { margin: 0 0 6px; color: var(--vscode-descriptionForeground); max-width: 1500px; }
.canvas {
  position: relative; width: 1800px; height: 720px; overflow: hidden;
  border: 1px solid var(--vscode-panel-border, var(--vscode-contrastBorder, transparent));
  background: var(--vscode-editor-background);
}
.layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.layer > .n { position: absolute; }
.layer > svg { position: absolute; left: 0; top: 0; z-index: 2; overflow: visible; pointer-events: none; }
.layer > .n { z-index: 1; }
.layer > svg.gutters { z-index: 1; } /* above the bands, below the cards that follow it */
/* Gutters: the channels connections run in. A faint wash of the foreground over the canvas, so they read as lanes
   without competing with the cards; high contrast themes get an outline instead, since washes vanish there. */
.gutter { fill: var(--vscode-editor-background); stroke: none; }
.metrics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12px; }
.metric { padding: 1px 6px; border-radius: 3px; border: 1px solid var(--vscode-contrastBorder, transparent); }
.metric.ok { background: var(--vscode-testing-iconPassed, #3a3); color: var(--vscode-editor-background); }
.metric.low { background: var(--vscode-errorForeground, #c33); color: var(--vscode-editor-background); }
.metric.na { color: var(--vscode-descriptionForeground); }
/* Embedded in index.html: no page heading, and the one panel fills the frame. */
.embed .page-head, .embed .panel > h2, .embed .panel > p { display: none; }
.embed .panel { display: flex; flex-direction: column; height: 100vh; margin: 0; box-sizing: border-box; }
.embed .canvas { flex: 1; width: auto; height: auto; border: 0; }
.embed .metrics { margin: 0; padding: 4px 8px; }
.nometrics .metrics { display: none; }
/* Shared chrome inside every canvas: zoom controls, minimap and legend stand-ins. */
.chrome { position: absolute; z-index: 3; display: flex; gap: 4px; align-items: center; }
.chrome button, .n button {
  display: inline-flex; gap: 4px; align-items: center; justify-content: center;
  border: 1px solid var(--vscode-button-border, transparent); border-radius: 2px;
  background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground);
  font: inherit; font-size: 12px; line-height: 18px; padding: 2px 8px; cursor: pointer;
}
.chrome .primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
.minimap {
  position: absolute; right: 12px; bottom: 12px; z-index: 3; width: 200px; height: 130px;
  border: 1px solid var(--vscode-widget-border, var(--vscode-contrastBorder, transparent));
  background: var(--vscode-editorWidget-background);
}
.minimap i { position: absolute; background: var(--vscode-disabledForeground); border-radius: 2px; }
.minimap .view { position: absolute; border: 1px solid var(--vscode-focusBorder); }
.legend {
  position: absolute; left: 56px; bottom: 12px; z-index: 3; display: flex; gap: 12px; padding: 4px 8px;
  background: var(--vscode-editorWidget-background); color: var(--vscode-descriptionForeground); font-size: 11px;
  border-radius: 2px;
}
.sw { display: inline-block; width: 18px; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.codicon { font-size: 14px; }

/* Layer accents come from the charts palette, which every theme defines, high contrast included. */
.n { --accent: var(--vscode-descriptionForeground); }
.n[data-layer="staging"] { --accent: var(--vscode-charts-blue); }
.n[data-layer="intermediate"] { --accent: var(--vscode-charts-purple); }
.n[data-layer="marts"] { --accent: var(--vscode-charts-green); }
.n[data-kind="source"] { --accent: var(--vscode-charts-orange); }
.n[data-kind="seed"] { --accent: var(--vscode-charts-yellow); }

.names { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.names .ttl { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.names .nm { overflow: hidden; color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family);
  font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
.r2 .names .nm { color: var(--muted); }
.pill .names { flex: 1; }
.pill:has(.nm) { height: 42px !important; border-radius: 21px !important; }
.edge { fill: none; stroke-width: 1.5; }
.arrowhead { fill: var(--vscode-descriptionForeground); }
.colhead { fill: var(--vscode-charts-blue, var(--vscode-focusBorder)); }
/* An edge off the focused model's lineage: kept for context, but faint and thin, with its arrowhead hidden. */
.edge.off { stroke-opacity: .22; stroke-width: 1 !important; stroke-dasharray: 3 4; }
.edge.off[marker-end] { marker-end: none; }
/* While a column is traced, table edges recede to a hint of structure and the trace carries the eye. */
.edge.faint { stroke-opacity: .14; }
.edge.faint[marker-end] { marker-end: none; }
.edge.faint[marker-start] { marker-start: none; }
/* Declared relationships: dotted, in their own hue, hoverable for the columns and the file that declares them. */
.edge.rel, .relmark { stroke: color-mix(in srgb, var(--vscode-charts-yellow) 70%, var(--vscode-foreground)); }
.edge.rel { stroke-width: 1.75; stroke-dasharray: 1 3.5; stroke-linecap: round; pointer-events: visibleStroke; }
.relmark { fill: none; stroke-width: 1.5; }
.edge.col[data-trace="1"] { stroke-width: 2.25; }
.edge.col { stroke: var(--vscode-charts-blue, var(--vscode-focusBorder)); }
.edge.col.indirect { stroke: var(--vscode-charts-purple, var(--vscode-descriptionForeground)); stroke-dasharray: 6 4; }

/* ---------- A: today's card ---------- */
.vA .edge.table { stroke: var(--vscode-editorWidget-border, var(--vscode-disabledForeground)); }
.vA .card {
  width: 280px; box-sizing: border-box; font-size: 12px; color: var(--vscode-foreground);
  border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent));
  border-radius: 4px; background: var(--vscode-editorWidget-background);
}
.vA .card.start { border-color: var(--vscode-focusBorder); }
.vA .card.sel { outline: 2px solid var(--vscode-focusBorder); }
.vA .card.hidden { border-style: dashed; opacity: .6; }
.vA .hd {
  position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 6px; align-items: center;
  height: 56px; box-sizing: border-box; padding: 6px 8px;
  border-bottom: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent));
}
.vA .type { padding: 0 4px; border-radius: 2px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); font-size: 10px; text-transform: uppercase; }
.vA .lay { padding: 0 4px; border: 1px solid var(--vscode-badge-background); border-radius: 2px; font-size: 10px; text-transform: uppercase; }
.vA .ttl { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.vA .sub { grid-column: 1 / -1; overflow: hidden; color: var(--vscode-descriptionForeground); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.vA .err { color: var(--vscode-errorForeground); }
.vA .act { display: flex; justify-content: space-between; align-items: center; gap: 4px; height: 28px; box-sizing: border-box; padding: 2px 4px; }
.vA .act button { padding: 2px 6px; }
.vA .chips { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 24px; gap: 0 4px; padding: 0 4px; }
.vA .chip { display: flex; gap: 4px; align-items: center; height: 20px; padding: 0 2px 0 6px; border-radius: 10px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); font-size: 11px; }
.vA .chip button { padding: 0 2px; border: 0; background: transparent; color: inherit; }
.vA .cols { padding: 4px 0; border-top: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); }
.vA .col { position: relative; display: flex; justify-content: space-between; height: 24px; align-items: center; padding: 0 10px; }
.vA .col.traced { background: var(--vscode-editor-findMatchHighlightBackground, var(--vscode-list-inactiveSelectionBackground)); }
.vA .col.selcol { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); }
.vA .dt { color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family); font-size: 11px; }
.vA .col.selcol .dt { color: inherit; }
.vA .grp {
  width: 280px; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px;
  border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); border-radius: 4px;
  background: var(--vscode-editorWidget-background); font-size: 12px;
  box-shadow: 4px 4px 0 -1px var(--vscode-editorWidget-background), 4px 4px 0 0 var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)),
    8px 8px 0 -2px var(--vscode-editorWidget-background), 8px 8px 0 -1px var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent));
}
.vA .grp b { font-weight: 600; } .vA .grp span { color: var(--vscode-descriptionForeground); }

/* ---------- B: compact, actions on selection ---------- */
.vB .edge.table { stroke: var(--vscode-editorLineNumber-foreground, var(--vscode-descriptionForeground)); }
.vB .card {
  position: relative; width: 220px; box-sizing: border-box; font-size: 12px;
  border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); border-radius: 6px;
  background: var(--vscode-editorWidget-background);
}
.vB .card.start { box-shadow: 0 0 0 2px var(--vscode-focusBorder); }
.vB .card.sel { outline: 2px solid var(--vscode-focusBorder); outline-offset: 1px; }
.vB .card.hidden { border-style: dashed; opacity: .6; }
.vB .hd { display: flex; gap: 6px; align-items: center; height: 30px; padding: 0 8px; }
.vB .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.vB .ttl { flex: 1; overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.vB .mat { color: var(--vscode-descriptionForeground); font-size: 11px; }
.vB .err { color: var(--vscode-errorForeground); }
.vB .exp {
  position: absolute; top: 5px; width: 20px; height: 20px; padding: 0 !important; border-radius: 10px !important; font-size: 10px !important;
  border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder)) !important;
}
.vB .exp.l { left: -11px; } .vB .exp.r { right: -11px; }
.vB .exp.on { background: var(--vscode-button-background) !important; color: var(--vscode-button-foreground) !important; }
.vB .tools {
  position: absolute; top: -30px; right: 0; display: flex; gap: 2px; padding: 2px; border-radius: 4px;
  background: var(--vscode-editorWidget-background); box-shadow: 0 2px 6px var(--vscode-widget-shadow);
  border: 1px solid var(--vscode-widget-border, var(--vscode-contrastBorder, transparent));
}
.vB .tools button { padding: 1px 4px; background: transparent; color: var(--vscode-foreground); }
.vB .chip { display: flex; gap: 4px; align-items: center; height: 20px; margin: 0 6px 4px; padding: 0 4px 0 8px; border-radius: 10px; font-size: 11px;
  border: 1px solid var(--vscode-badge-background); }
.vB .chip b { flex: 1; } .vB .chip button { padding: 0 2px; border: 0; background: transparent; color: inherit; }
.vB .cols { border-top: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); padding: 2px 0; }
.vB .col { display: flex; justify-content: space-between; height: 20px; align-items: center; padding: 0 8px; font-size: 11px; }
.vB .col.traced { background: var(--vscode-editor-findMatchHighlightBackground, var(--vscode-list-inactiveSelectionBackground)); }
.vB .col.selcol { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); }
.vB .dt { color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family); }
.vB .col.selcol .dt { color: inherit; }
.vB .grp { width: 220px; height: 30px; box-sizing: border-box; display: flex; gap: 6px; align-items: center; padding: 0 8px; font-size: 12px;
  border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); border-radius: 6px; background: var(--vscode-editorWidget-background);
  box-shadow: 3px 3px 0 -1px var(--vscode-editorWidget-background), 3px 3px 0 0 var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); }
.vB .grp b { flex: 1; font-weight: 600; }
.vB .count { padding: 0 6px; border-radius: 8px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); font-size: 11px; }

/* ---------- C: detailed, accent stripe and meta row ---------- */
.vC .edge.table { stroke: var(--vscode-descriptionForeground); stroke-opacity: .7; }
.vC .card {
  position: relative; width: 300px; box-sizing: border-box; font-size: 12px; overflow: visible;
  border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); border-left: 4px solid var(--accent);
  border-radius: 4px; background: var(--vscode-editorWidget-background);
}
.vC .card.start { box-shadow: 0 0 0 1px var(--vscode-focusBorder); }
.vC .card.sel { outline: 2px solid var(--vscode-focusBorder); }
.vC .card.hidden { border-style: dashed; opacity: .6; }
.vC .hd { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 6px; align-items: center; padding: 6px 8px 6px 8px; }
.vC .ico { color: var(--accent); }
.vC .ttl { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.vC .tools { display: flex; gap: 0; }
.vC .tools button { padding: 0 3px; background: transparent; color: var(--vscode-icon-foreground, var(--vscode-foreground)); border: 0; }
.vC .rel { grid-column: 1 / -1; overflow: hidden; color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.vC .meta { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: nowrap; font-size: 11px; color: var(--vscode-descriptionForeground); }
.vC .meta span { display: inline-flex; gap: 3px; align-items: center; }
.vC .meta .codicon { font-size: 12px; }
.vC .err { color: var(--vscode-errorForeground); }
.vC .exp { position: absolute; top: 8px; padding: 0 6px !important; border-radius: 9px !important; font-size: 11px !important; }
.vC .exp.l { left: -26px; } .vC .exp.r { right: -26px; }
.vC .exp.on { background: var(--vscode-button-background) !important; color: var(--vscode-button-foreground) !important; }
.vC .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 6px; }
.vC .chip { display: flex; gap: 4px; align-items: center; height: 20px; padding: 0 2px 0 6px; border-radius: 3px; font-size: 11px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }
.vC .chip button { padding: 0 2px; border: 0; background: transparent; color: inherit; }
.vC .cols { border-top: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); padding: 2px 0; }
.vC .col { display: grid; grid-template-columns: 1fr auto; height: 22px; align-items: center; padding: 0 10px; }
.vC .col.traced { background: var(--vscode-editor-findMatchHighlightBackground, var(--vscode-list-inactiveSelectionBackground)); }
.vC .col.selcol { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); }
.vC .dt { color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family); font-size: 11px; }
.vC .col.selcol .dt { color: inherit; }
.vC .grp { width: 300px; box-sizing: border-box; padding: 8px 10px; font-size: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 6px; align-items: center;
  border: 1px dashed var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); border-radius: 4px; background: var(--vscode-editorWidget-background); }
.vC .grp b { font-weight: 600; } .vC .grp .k { color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family); font-size: 11px; }
.vC .bar { grid-column: 1 / -1; display: flex; height: 6px; border-radius: 3px; overflow: hidden; }
.vC .bar i { display: block; }

/* ---------- D: layer lanes ---------- */
.vD .edge.table { stroke: var(--vscode-descriptionForeground); }
.vD .lane { position: absolute; top: 0; box-sizing: border-box; border-right: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); }
.vD .lane:nth-child(odd) { background: var(--vscode-sideBar-background, transparent); }
.vD .lane h3 { margin: 0; padding: 6px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--vscode-descriptionForeground); }
.vD .card { width: 240px; box-sizing: border-box; font-size: 12px; border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent));
  border-radius: 4px; background: var(--vscode-editorWidget-background); }
.vD .card.start { border-color: var(--vscode-focusBorder); border-width: 2px; }
.vD .card.sel { outline: 2px solid var(--vscode-focusBorder); }
.vD .card.hidden { border-style: dashed; opacity: .6; }
.vD .hd { display: grid; grid-template-columns: 1fr auto auto; gap: 1px 6px; padding: 5px 8px; align-items: center; }
.vD .ttl { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.vD .type { color: var(--vscode-descriptionForeground); font-size: 10px; text-transform: uppercase; }
.vD .sub { grid-column: 1 / -1; overflow: hidden; color: var(--vscode-descriptionForeground); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.vD .err { color: var(--vscode-errorForeground); }
.vD .act { display: flex; gap: 4px; padding: 0 6px 6px; } .vD .act button { padding: 0 6px; }
.vD .chip { margin: 0 6px 6px; padding: 1px 6px; border-radius: 3px; font-size: 11px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }
.vD .cols { border-top: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); padding: 2px 0; }
.vD .col { display: flex; justify-content: space-between; height: 22px; align-items: center; padding: 0 8px; }
.vD .col.traced { background: var(--vscode-editor-findMatchHighlightBackground, var(--vscode-list-inactiveSelectionBackground)); }
.vD .col.selcol { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); }
.vD .dt { color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family); font-size: 11px; }
.vD .col.selcol .dt { color: inherit; }
.vD .grp { width: 240px; box-sizing: border-box; display: flex; gap: 6px; align-items: center; padding: 6px 8px; font-size: 12px;
  border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); border-radius: 4px; background: var(--vscode-editorWidget-background); }
.vD .grp b { flex: 1; font-weight: 600; } .vD .grp span { color: var(--vscode-descriptionForeground); }

/* ---------- E: top-down overview pills ---------- */
.vE .edge.table { stroke: var(--vscode-descriptionForeground); }
.vE .pill { position: relative; width: 190px; height: 34px; box-sizing: border-box; display: flex; gap: 6px; align-items: center; padding: 0 10px 0 8px;
  border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); border-radius: 17px; background: var(--vscode-editorWidget-background); font-size: 12px; }
.vE .pill .ico { color: var(--accent); }
.vE .pill .ttl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vE .pill.start { border: 2px solid var(--vscode-focusBorder); font-weight: 600; }
.vE .pill.sel { outline: 2px solid var(--vscode-focusBorder); outline-offset: 2px; }
.vE .pill.hidden { border-style: dashed; opacity: .6; }
.vE .pill .n2 { color: var(--vscode-descriptionForeground); font-size: 11px; }
.vE .pill.grp { box-shadow: 3px 3px 0 -1px var(--vscode-editorWidget-background), 3px 3px 0 0 var(--vscode-editorWidget-border, var(--vscode-contrastBorder, transparent)); }
.vE .pop { position: absolute; left: 0; top: 42px; z-index: 2; width: 260px; box-sizing: border-box; padding: 8px 10px; font-size: 12px; font-weight: normal;
  border: 1px solid var(--vscode-editorHoverWidget-border, var(--vscode-widget-border, var(--vscode-contrastBorder))); border-radius: 4px;
  background: var(--vscode-editorHoverWidget-background, var(--vscode-editorWidget-background)); color: var(--vscode-editorHoverWidget-foreground, var(--vscode-foreground));
  box-shadow: 0 2px 8px var(--vscode-widget-shadow); }
.vE .pop .sub { color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family); font-size: 11px; margin: 2px 0 6px; }
.vE .pop .row { display: flex; gap: 4px; margin-top: 6px; } .vE .pop .row button { padding: 0 6px; }
.vE .err { color: var(--vscode-errorForeground); }

/* ---------- Round 2: C's colour and lines, quieter, with D's lanes and E's minimal nodes ---------- */
/* Contrast fixes over round 1: outlines mix foreground into the background, selection mixes focus into foreground,
   layer hues mix chart colours toward foreground, so each clears 3:1 in themes whose own tokens are faint. */
.r2 {
  --line: color-mix(in srgb, var(--vscode-foreground) 55%, var(--vscode-editor-background));
  --muted: color-mix(in srgb, var(--vscode-descriptionForeground) 70%, var(--vscode-foreground));
  --sel: color-mix(in srgb, var(--vscode-focusBorder) 55%, var(--vscode-foreground));
}

.r2 .rel { grid-column: 1 / -1; min-width: 0; overflow: hidden; color: var(--muted); font-family: var(--vscode-editor-font-family);
  font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

/* Top-down: the parents bubble sits centred on the card's top edge, the children bubble on its bottom edge, where
   the edges arrive and leave. The arrow says which way each one expands. */

<body>
<div class="page-head"><h1>Lineage card designs</h1><span id="theme-name"></span></div>
<div id="panels"></div>
<script>
const params = new URLSearchParams(location.search);
const themeName = params.get("theme") ?? "Default Dark Modern";
const theme = window.THEMES[themeName];
for (const [k, v] of Object.entries(theme.vars)) document.documentElement.style.setProperty(k, v);
document.body.className = theme.bodyClass;
if (params.has("embed")) document.documentElement.classList.add("embed");
if (params.has("nometrics")) document.documentElement.classList.add("nometrics");
document.getElementById("theme-name").textContent = `${themeName} (${theme.bodyClass})`;

// One sample neighbourhood, drawn by every design: a source and seed upstream, the start model, its children,
// two closed groups and one open group, a model with an error, one from another package and a hidden one.
const NODES = {
  src_orders: { kind: "source", title: "orders", name: "shop.orders", ref: "shop.orders", rel: "RAW.shop.ORDERS", tests: 2, parents: 0, children: 1 },
  seed_cc: { kind: "seed", title: "country_codes", rel: "DEV.seeds.country_codes", mat: "seed", parents: 0, children: 1 },
  stg_orders: { kind: "model", layer: "staging", title: "orders", name: "stg_shop__orders", rel: "DEV_STAGING.shop", mat: "view", tests: 4, parents: 1, children: 1,
    columns: [["order_id", "varchar"], ["amount", "number(38,2)"]] },
  int_orders: { kind: "model", layer: "intermediate", title: "orders_enriched", name: "int_orders__enriched", rel: "DEV_INTERMEDIATE.orders", mat: "table", tests: 3,
    parents: 5, children: 4, start: true, expanded: [true, true], chips: [["backend", 2, 5]],
    columns: [["order_id", "varchar"], ["customer_id", "varchar"], ["amount", "number(38,2)"]], selcol: "amount" },
  fct_orders: { kind: "model", layer: "marts", title: "fct_orders", rel: "DEV.marts", mat: "incremental", tests: 6, parents: 3, children: 2, selected: true,
    columns: [["order_id", "varchar"], ["customer_id", "varchar"], ["amount_usd", "number(38,2)"], ["ordered_at", "timestamp_ntz"]],
    traced: "amount_usd" },
  dim_customers: { kind: "model", layer: "marts", title: "dim_customers", rel: "DEV.marts", mat: "table", tests: 5, parents: 2, children: 4,
    error: "Column email is not in the model's contract" },
  rev_daily: { kind: "model", layer: "marts", title: "daily_revenue", name: "fct_finance__daily_revenue_by_region_and_channel", rel: "DEV_FINANCE.reporting", mat: "incremental",
    pkg: "finance_pkg", parents: 4, children: 0, columns: [["region", "varchar"], ["revenue_usd", "number(38,2)"]] },
  be_accounts: { kind: "model", layer: "staging", title: "accounts", name: "stg_backend__accounts", rel: "DEV_STAGING.backend", mat: "view", parents: 2, children: 3 },
  be_users: { kind: "model", layer: "staging", title: "users", name: "stg_backend__users", rel: "DEV_STAGING.backend", mat: "view", parents: 1, children: 6 },
  audit_log: { kind: "model", title: "audit_log", rel: "DEV.ops", mat: "view", hidden: true, parents: 1, children: 0 },
  "g:finance": { group: true, title: "finance", key: "models/marts/finance", count: 12, mix: { marts: 9, intermediate: 3 } },
  "g:payments": { group: true, title: "payments", key: "models/staging/payments", count: 7, mix: { staging: 7 } },
};
// A neighbourhood that flows source -> staging -> intermediate -> marts: the start model's parents include an opened
// backend group (two cards and a chip) and a closed payments group; its children are marts, one closed finance group
// and a hidden model.
const EDGES = [
  ["src_orders", "stg_orders"], ["stg_orders", "int_orders"], ["seed_cc", "int_orders"],
  ["be_accounts", "int_orders"], ["be_users", "int_orders"], ["g:payments", "int_orders"],
  ["int_orders", "fct_orders"], ["int_orders", "dim_customers"], ["int_orders", "rev_daily"],
  ["int_orders", "g:finance"], ["int_orders", "audit_log"], ["dim_customers", "fct_orders"],
  // Legacy shortcuts: the start model also reads the raw source directly, and a mart reads staging directly.
  ["src_orders", "int_orders"], ["be_users", "rev_daily"],
];
const ALL_NODES = NODES, ALL_EDGES = EDGES;
// Names as M shows them: the alias when the model sets one, the file that defines the node, and project.type.
const FILES = {
  src_orders: { name: "shop.orders", file: "models/11_sources/shop/src__shop__orders.yml", ref: "source('shop', 'orders')" },
  seed_cc: { file: "seeds/country_codes.csv" },
  stg_orders: { alias: "orders", file: "models/13_staging/shop/stg_shop__orders.sql" },
  int_orders: { alias: "orders_enriched", file: "models/21_intermediate/int_orders__enriched.sql" },
  fct_orders: { file: "models/31_marts/fct_orders.sql" },
  dim_customers: { file: "models/31_marts/dim_customers.sql" },
  rev_daily: { alias: "daily_revenue", file: "models/31_marts/finance/fct_finance__daily_revenue_by_region_and_channel.sql", project: "finance_pkg" },
  be_accounts: { alias: "accounts", file: "models/13_staging/backend/stg_backend__accounts.sql" },
  be_users: { alias: "users", file: "models/13_staging/backend/stg_backend__users.sql" },
  audit_log: { file: "models/41_ops/audit_log.sql" },
};
// Declared relationships, in the two forms finance-pipelines uses: `config.meta.relationships` on a source table in
// its src__*.yml, and a `relationships:` block in a src__*.sql registration (`to: ref(...)` or `to: source(...)`).
// Each says the declaring table's from_columns reference another table's to_columns. They are keys, not data flow.
const DECLARED = [
  { from: "src_orders", cols: ["customer_id"], to: "be_users", toCols: ["user_id"], in: "src__shop__orders.yml" },
  { from: "be_accounts", cols: ["user_id"], to: "be_users", toCols: ["user_id"], in: "stg_backend__accounts.yml" },
  { from: "int_orders", cols: ["customer_id"], to: "dim_customers", toCols: ["customer_id"], in: "int_orders__enriched.yml" },
  { from: "fct_orders", cols: ["customer_id"], to: "dim_customers", toCols: ["customer_id"], in: "fct_orders.yml" },
  { from: "rev_daily", cols: ["region"], to: "seed_cc", toCols: ["code"], in: "fct_finance__daily_revenue_by_region_and_channel.yml" },
];
// Column lineage among listed columns. The selected column is orders_enriched.amount: upstream it comes from
// staging orders.amount; downstream it becomes fct_orders.amount_usd and daily_revenue.revenue_usd. The id columns
// are lineage too, but not part of that trace.
const COL_EDGES = [
  ["stg_orders", "order_id", "int_orders", "order_id", "direct"],
  ["stg_orders", "amount", "int_orders", "amount", "direct"],
  ["int_orders", "order_id", "fct_orders", "order_id", "direct"],
  ["int_orders", "customer_id", "fct_orders", "customer_id", "direct"],
  ["int_orders", "amount", "fct_orders", "amount_usd", "indirect"],
  ["int_orders", "amount", "rev_daily", "revenue_usd", "indirect"],
];
const TRACE = { table: "int_orders", column: "amount" };
// The trace is everything upstream and downstream of the selected column.
const TRACED = (() => {
  const key = (t, c) => `${t}.${c}`, seen = new Set([key(TRACE.table, TRACE.column)]);
  for (const dir of [0, 1]) {
    const stack = [key(TRACE.table, TRACE.column)];
    while (stack.length) {
      const k = stack.pop();
      for (const [a, ac, b, bc] of COL_EDGES) {
        const [from, to] = dir ? [key(b, bc), key(a, ac)] : [key(a, ac), key(b, bc)];
        if (from === k && !seen.has(to)) { seen.add(to); stack.push(to); }
      }
    }
  }
  return seen;
})();
const LAYER_ORDER = ["source", "staging", "intermediate", "marts", "other"];
const laneOf = (n) => n.group ? Object.keys(n.mix)[0] : n.kind === "source" || n.kind === "seed" ? "source" : n.layer ?? "other";

const ICON = { source: "database", seed: "file", model: "table" };
const badge = (n) => n.layer ?? n.kind;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const mid = (s, max) => s.length <= max ? s : s.slice(0, Math.ceil((max - 1) / 3)) + "…" + s.slice(s.length - Math.floor((max - 1) * 2 / 3));
const attrs = (id, n) => `data-id="${id}" data-kind="${n.kind ?? "group"}" data-layer="${n.layer ?? Object.keys(n.mix ?? {})[0] ?? ""}"`;
const cls = (n, base) => [base, n.start && "start", n.selected && "sel", n.hidden && "hidden"].filter(Boolean).join(" ");
const subOf = (n) => [n.rel, n.mat, n.pkg].filter(Boolean).join(" · ");
const colRows = (n, h) => n.columns ? n.columns.map(([c, t]) => [c, t,
  n.traced === c || (TRACED.has(`${Object.keys(NODES).find((id) => NODES[id] === n)}.${c}`) && n.selcol !== c) ? c : n.traced]).map(([c, t, tr]) =>
  `<div class="col ${c === n.selcol ? "selcol" : c === tr ? "traced" : ""}" data-col="${c}" ${c === n.selcol ? 'data-m="selcol"' : ""}>` +
  `<span>${c}</span><span class="dt">${t}</span>${colBubbles(n, c)}</div>`).join("") : "";
// Count bubbles on a traced column row: upstream columns on the left edge, downstream columns on the right edge.
const colBubbles = (n, c) => {
  const id = Object.keys(NODES).find((k) => NODES[k] === n), key = `${id}.${c}`;
  if (!TRACED.has(key)) return "";
  const ins = COL_EDGES.filter(([a, ac, b, bc]) => `${b}.${bc}` === key).length;
  const outs = COL_EDGES.filter(([a, ac]) => `${a}.${ac}` === key).length;
  return (ins ? `<span class="cb in" title="${ins} upstream column${ins === 1 ? "" : "s"}">${ins}</span>` : "") +
    (outs ? `<span class="cb out" title="${outs} downstream column${outs === 1 ? "" : "s"}">${outs}</span>` : "");
};
const sign = (on) => on ? "−" : "+";
// Title block: the alias on top, bold; the dbt name underneath, muted, only when it differs. Both are cut at the
// end by CSS, so the start that says what a node is always shows; the full text is in the tooltip.
const names = (n, max = 99) => `<span class="names" title="${esc([n.title, n.name].filter(Boolean).join("\n"))}">` +
  `<span class="ttl" data-m="title">${n.title.length > max ? mid(n.title, max) : n.title}</span>` +
  (n.name && n.name !== n.title ? `<span class="nm" data-m="name">${n.name}</span>` : "") + "</span>";

// M's title block: the alias if the model sets one (bold), then the file it is defined in, then project.type. With no
// alias the file name leads; a source leads with source_name.table_name, since its file holds many tables. Each line is cut at the end; the tooltip has the path, the relation and the ref.
const stem = (f) => f.split("/").pop().replace(/\.[^.]+$/, "");
const names3 = (id, n) => {
  const f = FILES[id] ?? { file: n.title }, kind = `${f.project ?? "jaffle_shop"}.${n.kind}`;
  const tip = [f.alias && `alias: ${f.alias}`, f.file, kind, f.ref, n.rel && `relation: ${n.rel}`].filter(Boolean).join("\n");
  const lead = f.alias ?? f.name;
  return `<span class="names" title="${esc(tip)}"><span class="ttl" data-m="title">${esc(lead ?? stem(f.file))}</span>` +
    (lead ? `<span class="nm" data-m="name">${esc(stem(f.file))}</span>` : "") +
    `<span class="tags"><span class="tag">${esc(f.project ?? "jaffle_shop")}</span><span class="tag">${esc(n.kind)}</span></span></span>`;
};

const VARIANTS = [
  {
    id: "A", name: "A · Today", rankdir: "LR", ranksep: 160, nodesep: 40, curve: "bezier",
    about: "The card as shipped: 280px, badge and alias, relation line, an always-visible actions row with expanders at each end, chips two to a row, 24px columns.",
    node(id, n) {
      if (n.group) return `<div class="grp" ${attrs(id, n)} data-m="card"><b data-m="title">${n.title}</b><span>${n.count}</span><span>${mid(n.key, 16)}</span></div>`;
      const [p, c] = n.expanded ?? [false, false];
      return `<div class="${cls(n, "card")}" ${attrs(id, n)} data-m="card">
        <div class="hd" data-port="1"><span class="${n.layer ? "lay" : "type"}" data-m="badge">${badge(n)}</span>
        ${names(n)}
        <span>${n.error ? '<i class="codicon codicon-warning err"></i>' : n.hidden ? '<i class="codicon codicon-eye-closed"></i>' : ""}</span>
        <span class="sub" data-m="sub">${subOf(n)}</span></div>
        <div class="act"><button>${sign(p)}${n.parents}</button><button>Columns</button><button>Details</button>
        <button><i class="codicon codicon-go-to-file"></i></button><button>${n.children}${sign(c)}</button></div>
        ${n.chips ? `<div class="chips">${n.chips.map(([l, d, t]) => `<span class="chip"><b>${l}</b> ${d}/${t}<button>+${t - d}</button><button>✕</button></span>`).join("")}</div>` : ""}
        ${n.columns ? `<div class="cols">${colRows(n)}</div>` : ""}</div>`;
    },
  },
  {
    id: "B", name: "B · Compact", rankdir: "LR", ranksep: 110, nodesep: 18, curve: "step",
    about: "220px, one line: a layer dot, the title and the materialization. Relation and tests in the tooltip. Expanders are round count buttons on the card's edges; Columns, Details and Open file appear as a toolbar on the selected card only.",
    node(id, n) {

// ---- WCAG contrast of what each design draws, under this theme ----
const parse = (c) => {
  let m = c.match(/rgba?\(([^)]+)\)/);
  if (m) {
    const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number);
    return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
  }
  m = c.match(/color\(srgb ([^)]+)\)/);
  if (m) {
    const p = m[1].replace("/", " ").split(/\s+/).filter(Boolean).map(Number);
    return { r: p[0] * 255, g: p[1] * 255, b: p[2] * 255, a: p.length > 3 ? p[3] : 1 };
  }
  return null;
};
const over = (top, bottom) => ({
  r: top.r * top.a + bottom.r * (1 - top.a), g: top.g * top.a + bottom.g * (1 - top.a), b: top.b * top.a + bottom.b * (1 - top.a), a: 1,
});
const lum = ({ r, g, b }) => [r, g, b].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; })
  .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
function bgOf(el) {
  const chain = [];
  for (let e = el; e; e = e.parentElement) chain.push(e);
  let bg = parse(getComputedStyle(document.body).backgroundColor) ?? { r: 255, g: 255, b: 255, a: 1 };
  for (const e of chain.reverse()) {
    const c = parse(getComputedStyle(e).backgroundColor);
    if (c && c.a > 0) bg = over(c, bg);
  }
  return bg;
}
function measure(panel, canvas) {
  const out = [];
  const canvasBg = bgOf(canvas);
  const text = (sel, label) => {
    const el = panel.querySelector(sel);
    if (!el) return out.push([label, null, 4.5]);
    const fg = parse(getComputedStyle(el).color);
    out.push([label, ratio(over(fg, bgOf(el)), bgOf(el)), 4.5]);
  };
  text('[data-m="title"]', "title");
  text('[data-m="sub"]', "line 2");
  text('[data-m="badge"]', "badge");
  text('[data-m="selcol"]', "selected column");
  const card = panel.querySelector('.n:not(.hidden) [data-m="card"]:not(.start):not(.sel), [data-m="card"]');
  const st = getComputedStyle(card);
  const border = parse(st.borderTopColor);
  const borderRatio = border && parseFloat(st.borderTopWidth) > 0 ? ratio(over(border, canvasBg), canvasBg) : 1;
  const fillRatio = ratio(bgOf(card), canvasBg);
  out.push(["card edge", Math.max(borderRatio, fillRatio), 3]);
  const stripe = panel.querySelector("[data-accent]");
  const accent = panel.querySelector('[data-m="accent"]');
  if (stripe) {
    const c = parse(getComputedStyle(stripe).getPropertyValue(stripe.dataset.accent));
    out.push(["layer accent", ratio(over(c, bgOf(stripe)), bgOf(stripe)), 3]);
  } else if (accent) {
    const s = getComputedStyle(accent);
    const c = parse(s.backgroundColor)?.a ? parse(s.backgroundColor) : parse(s.color);
    out.push(["layer accent", ratio(over(c, bgOf(accent)), bgOf(accent)), 3]);
  }
  const edge = (sel, label) => {
    const el = panel.querySelector(sel);
    if (!el) return;
    const s = getComputedStyle(el);
    const c = parse(s.stroke);
    c.a *= parseFloat(s.strokeOpacity || "1");
    out.push([label, ratio(over(c, canvasBg), canvasBg), 3]);
  };
  edge("path.edge.table:not(.faint):not(.off)", "table edge");
  edge("path.edge.col:not(.indirect)", "column edge");
  edge("path.edge.col.indirect", "indirect edge");
  // The selection ring as drawn: the selected card's outline, or its border when it has no outline.
  const sel = panel.querySelector('[data-m="card"].sel');
  if (sel) {
    const s = getComputedStyle(sel);
    const c = parse(s.outlineStyle !== "none" ? s.outlineColor : s.borderTopColor);
    if (c) out.push(["selection outline", ratio(over(c, canvasBg), canvasBg), 3]);
  }
  return out;
}
function hexToRgb(h) {
  const x = h.replace("#", "");
  const full = x.length <= 4 ? [...x].map((c) => c + c).join("") : x;
  const [r, g, b, a] = [0, 2, 4, 6].map((i) => parseInt(full.slice(i, i + 2) || "ff", 16));
  return `rgba(${r}, ${g}, ${b}, ${a / 255})`;
}

// ---- layout and drawing ----
function draw(v) {
  // Column bubbles are part of the trace: shown before layout, so edges can meet them.
  document.documentElement.classList.toggle("trace-on", (params.get("mode") ?? "column") === "column");
  // Focus mode draws the focused model's lineage as real models only; folder groups are for free exploration.
  const NODES = v.corridor ? Object.fromEntries(Object.entries(ALL_NODES).filter(([, n]) => !n.group)) : ALL_NODES;
  const EDGES = ALL_EDGES.filter(([a, b]) => a in NODES && b in NODES);
  // Edges the layout places cards by: the dbt dependencies, plus the declared relationships when they are shown.
  const LAYOUT_EDGES = (params.get("deps") ?? "dbt") === "dbt" ? EDGES
    : [...EDGES, ...DECLARED.filter((r) => r.from in NODES && r.to in NODES).map((r) => [r.from, r.to])];
  const panel = document.createElement("section");
  panel.className = `panel v${v.id}${v.round2 ? " r2" : ""}`;
  panel.innerHTML = `<h2>${v.name}</h2><p>${v.about}</p><div class="canvas"><div class="layer"></div></div><div class="metrics"></div>`;
  document.getElementById("panels").append(panel);
  const canvas = panel.querySelector(".canvas");
