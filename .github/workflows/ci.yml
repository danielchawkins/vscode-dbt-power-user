name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check-and-package.yml

  napi-parity:
    # Linux runs on every pull request. macOS and Windows run only on workflow_dispatch, like the smoke jobs below.
    # Each runner builds the Node-API binding and compares its bytes, and the WebAssembly build's, with the golden.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates

      - name: Build the Node-API binding
        run: just crates::napi

      - name: Compare native and WebAssembly output with the golden
        run: just crates::parity

      - name: A planted divergence fails parity
        run: just crates::parity-plant

  smoke-vscode:
    # Off until macOS runners start jobs reliably; `just smoke-docker` runs the same smoke on both hosts locally.
    # Run it on demand from the Actions tab with `workflow_dispatch`.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12

      - name: Install direnv
        run: |
          bash scripts/smoke/fetch-direnv.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Restore pinned hosts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/fusion-power-user/hosts
          key: ${{ runner.os }}-${{ runner.arch }}-fpu-hosts-vscode-${{ hashFiles('scripts/smoke/pins.env') }}

      - name: Install JavaScript dependencies
        run: just sync

      - name: Download VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fusion-power-user-vsix

      - name: Verify VSIX
        run: shasum -a 256 -c vsix.sha256

      - name: Smoke VS Code 1.141.x
        run: |
          just benchmark-runtime-vscode fusion-power-user-*.vsix

      - name: Interaction smoke VS Code 1.141.x
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-vscode --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/single-project

      - name: Multi-root LSP smoke VS Code 1.141.x
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-vscode --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/multi-root

      - name: Opened-file smoke VS Code 1.141.x
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-vscode --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/nested-project

      - name: Nested-root smoke VS Code 1.141.x
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-vscode --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/nested-roots

      - name: Worktrees smoke VS Code 1.141.x
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-vscode --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/worktrees

      - name: Tool-environment smoke VS Code 1.141.x
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
        run: |
          just smoke-vscode --vsix fusion-power-user-*.vsix --tool-env

      - name: Summarize smoke failures
        if: failure()
        run: node scripts/smoke/failure-summary.mjs out/smoke-diagnostics >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-diagnostics-vscode
          path: out/smoke-diagnostics
          retention-days: 7
          if-no-files-found: ignore

  smoke-cursor:
    # Off until macOS runners start jobs reliably; `just smoke-docker` runs the same smoke on both hosts locally.
    # Run it on demand from the Actions tab with `workflow_dispatch`.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12

      - name: Install direnv
        run: |
          bash scripts/smoke/fetch-direnv.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Restore pinned hosts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/fusion-power-user/hosts
          key: ${{ runner.os }}-${{ runner.arch }}-fpu-hosts-cursor-${{ hashFiles('scripts/smoke/pins.env') }}

      - name: Install JavaScript dependencies
        run: just sync

      - name: Download VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fusion-power-user-vsix

      - name: Verify VSIX
        run: shasum -a 256 -c vsix.sha256

      - name: Smoke Cursor pinned stable
        run: |
          just benchmark-runtime-cursor fusion-power-user-*.vsix

      - name: Interaction smoke Cursor pinned stable
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-cursor --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/single-project

      - name: Multi-root LSP smoke Cursor pinned stable
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-cursor --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/multi-root

      - name: Opened-file smoke Cursor pinned stable
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-cursor --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/nested-project

      - name: Nested-root smoke Cursor pinned stable
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-cursor --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/nested-roots

      - name: Worktrees smoke Cursor pinned stable
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
          FPU_SMOKE_REQUIRE_FUSION: "1"
        run: |
          just smoke-cursor --vsix fusion-power-user-*.vsix --fixture src/test/fixtures/worktrees

      - name: Tool-environment smoke Cursor pinned stable
        env:
          FPU_SKIP_INTEGRATION_COMPILE: "1"
        run: |
          just smoke-cursor --vsix fusion-power-user-*.vsix --tool-env

      - name: Summarize smoke failures
        if: failure()
        run: node scripts/smoke/failure-summary.mjs out/smoke-diagnostics >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-diagnostics-cursor
          path: out/smoke-diagnostics
          retention-days: 7
          if-no-files-found: ignore
