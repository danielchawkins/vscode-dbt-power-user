name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check-and-package.yml

  release:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match package.json version $expected" >&2
            exit 1
          fi

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: $GITHUB_SHA is not an ancestor of origin/main; tag a merged main commit" >&2
            exit 1
          fi

      - name: Download VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fusion-power-user-vsix

      - name: Verify VSIX
        run: shasum -a 256 -c vsix.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" fusion-power-user-*.vsix vsix.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
