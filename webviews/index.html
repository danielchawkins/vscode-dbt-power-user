<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vscode DBT Power user extension</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap");
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- The dev server renders the panel named by ?entry=, a file in src/entries. -->
    <script type="module">
      const entry =
        new URLSearchParams(location.search).get("entry") ?? "queryResults";
      document.body.dataset.entry = entry;
      import(`/src/entries/${entry}.tsx`);
    </script>
  </body>
</html>
